name: CI

on:
  push:
    branches: [dev, stage, main]
  pull_request:
    branches: [dev, stage, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: osint-tool
    steps:
      - uses: actions/checkout@v5

      - name: Frontend syntax check
        run: node --check frontend/app.js

      - name: VERSION is semver
        run: grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' backend/VERSION

      - name: Backend tests (Docker, same as local)
        run: docker compose --profile test run --rm --build tests python -m pytest -q tests -p no:warnings

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Course tool tests (09-yakuniy-loyiha)
        working-directory: .
        run: |
          python -m pip install --quiet pytest requests
          python -m pytest -q 09-yakuniy-loyiha/kod -p no:cacheprovider
