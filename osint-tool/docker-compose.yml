services:
  redis:
    image: redis:7-alpine
    container_name: osint-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - osint-net
    restart: unless-stopped

  searxng:
    # private metasearch: one query fans out to several engines (see
    # searxng/settings.yml), so web search no longer depends on one engine
    image: searxng/searxng:2026.10.30-ffa88e3ba
    container_name: osint-searxng
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:-nexus-osint-local-only-change-me}
      - SEARXNG_BASE_URL=http://searxng:8080/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - osint-net
    restart: unless-stopped

  geoclip:
    # image -> likely GPS points (GeoCLIP, MIT). Internal only, CPU.
    build:
      context: ./geoclip
    container_name: osint-geoclip
    volumes:
      - geoclip-cache:/cache
    networks:
      - osint-net
    restart: unless-stopped

  ollama-proxy:
    # Ollama listens on the host's 127.0.0.1 only. This forwards the compose
    # network's gateway (172.20.0.1:11435) to it, so the backend can use the
    # local models without exposing Ollama to the LAN or changing the host.
    image: alpine/socat:1.8.1.1
    container_name: osint-ollama-proxy
    network_mode: host
    # range=: only clients from this compose network are accepted — containers
    # on other docker networks and LAN hosts are refused even if routable
    command: ["TCP-LISTEN:11435,bind=172.20.0.1,range=172.20.0.0/16,fork,reuseaddr", "TCP:127.0.0.1:11434"]
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osint-backend
    volumes:
      - osint-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - HIBP_API_KEY=${HIBP_API_KEY:-}
      - OPENSANCTIONS_API_KEY=${OPENSANCTIONS_API_KEY:-}
      - OPENCORPORATES_API_KEY=${OPENCORPORATES_API_KEY:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - GEOCLIP_URL=${GEOCLIP_URL:-http://geoclip:8090}
      - SECURITYTRAILS_API_KEY=${SECURITYTRAILS_API_KEY:-}
      - HUNTER_API_KEY=${HUNTER_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - COMPANIES_HOUSE_API_KEY=${COMPANIES_HOUSE_API_KEY:-}
      - HOLEHE_ALLOW_LOGIN=${HOLEHE_ALLOW_LOGIN:-}
      - HOLEHE_INCLUDE_ADULT=${HOLEHE_INCLUDE_ADULT:-}
      - OSINT_API_KEY=${OSINT_API_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
      - OLLAMA_URL=${OLLAMA_URL:-http://127.0.0.1:11434}
      - OLLAMA_BACKEND_URL=${OLLAMA_BACKEND_URL:-http://172.20.0.1:11435}
      - OLLAMA_FAST_MODEL=${OLLAMA_FAST_MODEL:-qwen2.5:7b}
      - OLLAMA_SMART_MODEL=${OLLAMA_SMART_MODEL:-qwen3:8b}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - OLLAMA_VISION_MODEL=${OLLAMA_VISION_MODEL:-qwen2.5vl:7b}
      - CASES_DB_PATH=/app/data/cases.db
      - REDIS_URL=redis://redis:6379/0
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-900}
      - RATE_LIMIT_HEAVY=${RATE_LIMIT_HEAVY:-4/minute}
      - RATE_LIMIT_LIGHT=${RATE_LIMIT_LIGHT:-15/minute}
      - RATE_LIMIT_GENERAL=${RATE_LIMIT_GENERAL:-60/minute}
      - RATE_LIMIT_POLL=${RATE_LIMIT_POLL:-120/minute}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - osint-net
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osint-worker
    command: ["arq", "worker.WorkerSettings"]
    volumes:
      - osint-data:/app/data
    environment:
      - CASES_DB_PATH=/app/data/cases.db
      - WATCH_POLL_MINUTES=${WATCH_POLL_MINUTES:-5}
      - HIBP_API_KEY=${HIBP_API_KEY:-}
      - OPENSANCTIONS_API_KEY=${OPENSANCTIONS_API_KEY:-}
      - OPENCORPORATES_API_KEY=${OPENCORPORATES_API_KEY:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - GEOCLIP_URL=${GEOCLIP_URL:-http://geoclip:8090}
      - SECURITYTRAILS_API_KEY=${SECURITYTRAILS_API_KEY:-}
      - HUNTER_API_KEY=${HUNTER_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - COMPANIES_HOUSE_API_KEY=${COMPANIES_HOUSE_API_KEY:-}
      - HOLEHE_ALLOW_LOGIN=${HOLEHE_ALLOW_LOGIN:-}
      - HOLEHE_INCLUDE_ADULT=${HOLEHE_INCLUDE_ADULT:-}
      - REDIS_URL=redis://redis:6379/0
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-900}
      - WORKER_MAX_JOBS=${WORKER_MAX_JOBS:-4}
      - WORKER_JOB_TIMEOUT=${WORKER_JOB_TIMEOUT:-1200}
      - WORKER_KEEP_RESULT=${WORKER_KEEP_RESULT:-3600}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - osint-net
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: osint-frontend
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - osint-net
    restart: unless-stopped

  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    environment:
      - OSINT_API_KEY=
    command: ["python", "-m", "pytest", "-q", "tests"]
    networks:
      - osint-net

networks:
  osint-net:
    driver: bridge
    ipam:
      config:
        # pinned so the Ollama proxy below knows the gateway address
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

volumes:
  osint-data:
  geoclip-cache:
